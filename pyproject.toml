[project]
name = "ha-merseytunnel"
version = "0.1.0"
description = "Home Assistant integration for Mersey Tunnels Fast Tag account balances"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [".git", ".venv"]
# Live tests hit the real website and need credentials, so they stay out of the
# default run. Opt in with: pytest -m live
addopts = "-m 'not live'"
markers = ["live: exercises the real Mersey Tunnels website"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.isort]
# Matches Home Assistant core, which keeps aliased imports on one line.
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private attributes to simulate a lapsed session.
"tests/*" = ["SLF001"]
"validate.py" = ["SLF001"]
